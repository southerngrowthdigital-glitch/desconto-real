<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectando TikTok · Desconto Real</title>
<link rel="icon" href="logo.png">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box;
         background:linear-gradient(180deg,#5b44c6,#2c1b64); color:#fff; text-align:center; }
  img { width:84px; height:84px; border-radius:20px; }
  a { color:#ffc420; font-weight:700; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Desconto Real">
  <h1 style="font-size:24px">Conectando o TikTok…</h1>
  <p id="msg">Voltando para o escritório no seu computador.</p>
</main>
<script>
  // Página de volta do login do TikTok: entrega o código ao escritório que roda neste computador.
  var q = location.search;
  if (q.indexOf("code=") >= 0 || q.indexOf("error=") >= 0) {
    location.replace("http://127.0.0.1:8777/tiktok/volta" + q);
  } else {
    document.getElementById("msg").innerHTML = 'Nada para conectar aqui. <a href="./">Página inicial</a>';
  }
</script>
</body>
</html>
